<!--
  comparison shell: a decision layer for one user situation, up to three alternatives.

  Copy this template to a temporary compare.html and keep this comment in it.
  Once the user chooses, integrate the choice into the existing prototype.html
  and verify it there. If no prototype exists, record the choice for its later
  build instead. Then delete this comparison and start fresh for the next
  decision; the full screen inventory belongs only in the canonical prototype.

  Contract (separate the decision layer from the product layer):
  - Product:  Each .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Situation: Put the concrete user situation in .sh-workspace's data-question.
  - Variants: .sh-workspace contains one direct .sh-options row with one to three
               direct children carrying unique data-variant and data-title.
  - States:   "Default" is automatic; presets in data-states.
  - Viewport: "vp (m)" cycles full / 390 / 768.
  - Tokens:   project tokens copied from PanelView.swift's Palette; dark under .sh-theme-dark.
  - Theme:    the light / dark switch (t) changes the product surface only.
  Self-contained by design: no build, no framework, no network.
-->
<title>Baton Panel Columns</title>
<meta charset="utf-8">
<style>
  /* Project tokens: Palette in Sources/ClaudeDesktopBaton/PanelView.swift (light). */
  :root {
    --background: #e9e9ea;
    --panel: #ffffff;
    --ink: #0a0a0a;
    --muted: #6b6b6b;
    --track: #ececec;
    --hover: #f4f4f4;
    --border: #eaeaea;
    --danger: #e5484d;
    --card: #f6f6f6;
    --foreground: #3a3a3a;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  /* Palette (dark). */
  .sh-theme-dark {
    --background: #1c1c1e;
    --panel: #0a0a0a;
    --ink: #ededed;
    --muted: #a1a1a1;
    --track: #262626;
    --hover: #181818;
    --border: #2a2a2a;
    --danger: #ff6369;
    --card: #141414;
    --foreground: #d7d7d7;
    color-scheme: dark;
  }

  /* ── review chrome (sh-*): keep ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background); color: var(--foreground);
    font-family: var(--font);
  }
  .sh-bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-question { overflow-wrap: anywhere; max-width: 100% }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }
  .sh-workspace { overflow-x: auto }
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* ── product: the menu bar panel, 300pt wide ── */
  .stage-inner { display: flex; justify-content: center; padding-top: 16px }
  .panel {
    width: 300px; background: var(--panel); color: var(--ink);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,.25), 0 12px 32px rgba(0,0,0,.18);
    font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  .sec { font-size: 10.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
         color: var(--muted); padding: 10px 16px 4px }
  .rule { height: 1px; background: var(--border) }
  .list { display: flex; flex-direction: column; padding: 0 6px 6px }
  .acct { padding: 10px; border-radius: 8px; cursor: default; position: relative }
  .acct.clickable { cursor: pointer }
  .acct.clickable:hover { background: var(--hover) }
  .acct.dim { opacity: .4 }
  .head { display: flex; align-items: center; gap: 8px; min-width: 0 }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
  .email { color: var(--muted); font-size: 11.5px; margin-top: 3px }
  .cli { font: 600 9.5px ui-monospace, Menlo, monospace; color: var(--muted);
         border: .75px solid color-mix(in srgb, var(--muted) 60%, transparent); border-radius: 3px; padding: 0 4px }
  .spin { width: 9px; height: 9px; border: 1.5px solid var(--ink); border-right-color: transparent;
          border-radius: 50%; animation: spin .9s linear infinite; flex: none }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s } }
  .bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden }
  .bar i { display: block; height: 100%; border-radius: 2px; background: var(--ink) }
  .bar.hit i { background: var(--danger) }
  .hit-t { color: var(--danger) }
  .reset { color: var(--muted); font-size: 11.5px; white-space: nowrap }
  .pct { width: 36px; text-align: right; flex: none }
  .footer { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px }
  .fbtn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 7px; cursor: pointer }
  .fbtn:hover { background: var(--hover) }
  .plus { color: var(--muted); font-size: 15px; line-height: 1 }
  .more { color: var(--muted); padding: 0 8px; font-size: 15px; letter-spacing: 1px }

  /* C: columns — limits side by side under the name; each account is one short block. */
  .vc .list { gap: 2px }
  .vc .name { font-size: 13.5px; font-weight: 600 }
  .vc .signed { padding: 0 16px 14px }
  .vc .signed .name { font-size: 15px }
  .vc .cols { margin-top: 8px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px }
  .vc .col { min-width: 0 }
  .vc .col-label { font-size: 9.5px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--muted);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .vc .col-pct { font-size: 15px; font-weight: 500; margin: 1px 0 4px }
  .vc .col .reset { font-size: 10.5px; margin-top: 4px; display: block; overflow: hidden; text-overflow: ellipsis }
  .vc .list .acct + .acct::before { content: ""; position: absolute; left: 10px; right: 10px; top: -1px; height: 1px; background: var(--border) }
  .vc .list .acct.clickable:hover::before, .vc .list .acct.clickable:hover + .acct::before { opacity: 0 }
</style>

<header class="sh-bar">
  <b>compare</b>
  <span id="sh-question"></span>
  <label class="sh-control" id="sh-variant-control"><span class="sh-control-label">variant</span><select id="sh-variant"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-workspace" data-question="Menu bar panel: limits in columns (approved layout C)" data-states="Switching">
  <div class="sh-options">
    <div data-variant="c" data-title="Panel"><div class="sh-stage"><div class="stage-inner"><div class="panel vc" id="pc"></div></div></div></div>
  </div>
</main>

<script>
  // Same sample data in every alternative; only the layout differs.
  const ACCOUNTS = [
    { id: 'alex', name: 'Acme · alex', email: 'alex@example.com', current: true, cli: true,
      limits: [['5-hour limit', 'Session', 62, '1h'], ['Weekly', 'Week', 81, 'Fri 9:13 PM'], ['Fable', 'Fable', 24, 'Fri 9:13 PM']] },
    { id: 'sam', name: 'Acme · sam', email: 'sam@example.com',
      limits: [['5-hour limit', 'Session', 8, '4h 40m'], ['Weekly', 'Week', 34, 'Mon 5:13 PM']] },
    { id: 'jordan', name: 'Acme · jordan', email: 'jordan@example.com',
      limits: [['5-hour limit', 'Session', 100, '1h 13m'], ['Weekly', 'Week', 97, '18h']] },
  ];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const bar = p => `<div class="bar${p >= 100 ? ' hit' : ''}"><i style="width:${Math.min(p, 100)}%"></i></div>`;
  const pct = p => `<span class="pct${p >= 100 ? ' hit-t' : ''}">${p}%</span>`;

  function head(a, switching) {
    const lead = switching === a.id ? '<span class="spin" aria-label="Switching"></span>' : '';
    const cli = a.cli ? '<span class="cli" title="The Claude Code CLI is signed in to this account.">CLI</span>' : '';
    return `<div class="head">${lead}<span class="name">${esc(a.name)}</span>${cli}</div>`
      + (a.current ? `<div class="email">${esc(a.email)}</div>` : '');
  }

  const LIMITS = {
    a: a => a.limits.map(([l, , p, r]) => `<div class="lim"><div class="lim-row"><span class="lim-label">${l}</span>`
      + `<span class="reset">↻ ${r}</span>${pct(p)}</div>${bar(p)}</div>`).join(''),
    b: a => `<div class="lims">` + a.limits.map(([, s, p, r]) =>
      `<span class="lim-label">${s}</span>${bar(p)}<span class="reset">↻ ${r}</span>${pct(p)}`).join('') + `</div>`,
    c: a => `<div class="cols">` + a.limits.map(([, s, p, r]) =>
      `<div class="col"><div class="col-label">${s}</div><div class="col-pct${p >= 100 ? ' hit-t' : ''}">${p}%</div>${bar(p)}`
      + `<span class="reset">↻ ${r}</span></div>`).join('') + `</div>`,
  };

  function render(v, switching) {
    const busy = !!switching;
    const block = (a, extra) => {
      const cls = ['acct', extra || ''];
      if (!a.current && !busy) cls.push('clickable');
      if (busy && switching !== a.id) cls.push('dim');
      return `<div class="${cls.join(' ')}" title="${esc(a.email)}">${head(a, switching)}${LIMITS[v](a)}</div>`;
    };
    const signed = ACCOUNTS.find(a => a.current), others = ACCOUNTS.filter(a => !a.current);
    return `<div class="sec">Signed in</div>${block(signed, 'signed')}<div class="rule"></div>`
      + `<div class="sec">Switch to</div><div class="list">${others.map(a => block(a)).join('')}</div>`
      + `<div class="rule"></div><div class="footer"><span class="fbtn${busy ? ' dimmed' : ''}" style="${busy ? 'opacity:.4' : ''}">`
      + `<span class="plus">+</span>Add account</span><span class="more">···</span></div>`;
  }

  let switchingId = null;
  function renderAll() { ['c'].forEach(v => { document.getElementById('p' + v).innerHTML = render(v, switchingId); }); }
  // Clicking another account starts a switch (the Switching preset); clicking the target again ends it.
  document.addEventListener('click', e => {
    const acct = e.target.closest('.panel .acct');
    if (!acct) return;
    if (acct.classList.contains('clickable')) {
      switchingId = acct.querySelector('.name').textContent.split('· ')[1];
      comparisonShell.setState('Switching'); renderAll();
    } else if (switchingId && acct.querySelector('.spin')) {
      switchingId = null; comparisonShell.setState('Default'); renderAll();
    }
  });
</script>

<script>
  const stage = document.querySelector('.sh-workspace');
  const stateSelect = document.getElementById('sh-state');
  const variantSelect = document.getElementById('sh-variant');
  const variantControl = document.getElementById('sh-variant-control');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  function fail(message) {
    const notice = document.createElement('p');
    notice.setAttribute('role', 'alert');
    notice.textContent = message;
    stage.replaceChildren(notice);
    document.querySelectorAll('.sh-bar select, .sh-bar button').forEach(control => control.disabled = true);
    throw new Error(message);
  }

  const question = (stage.dataset.question || '').trim();
  if (!question) fail('Name the user situation in data-question.');
  document.getElementById('sh-question').textContent = question;

  const rows = [...stage.querySelectorAll(':scope > .sh-options')];
  if (rows.length !== 1) fail('Use one alternatives row for the current decision.');
  const currentVariants = [...rows[0].children].filter(node => node.matches('[data-variant]'));
  const ids = currentVariants.map(variant => variant.dataset.variant.trim());
  if (currentVariants.length < 1 || currentVariants.length > 3 || new Set(ids).size !== ids.length || ids.includes('')) {
    fail('The decision needs 1–3 alternatives with unique, nonempty data-variant values.');
  }
  currentVariants.forEach((variant, index) => { variant.dataset.variant = ids[index]; });

  function buildVariants() {
    variantControl.hidden = currentVariants.length === 1;
    variantSelect.replaceChildren();
    currentVariants.forEach(variant => variantSelect.add(new Option(
      variant.dataset.title || variant.dataset.variant, variant.dataset.variant)));
    applyVariant(currentVariants[0].dataset.variant);
  }

  function applyVariant(id) {
    const active = currentVariants.some(variant => variant.dataset.variant === id)
      ? id : currentVariants[0].dataset.variant;
    const leaving = currentVariants.find(variant => !variant.hidden);
    const leavingFrame = leaving && leaving.querySelector('.sh-stage');
    const frameOffset = leavingFrame ? leavingFrame.scrollTop : 0;
    const pageOffset = scrollY;
    currentVariants.forEach(variant => { variant.hidden = variant.dataset.variant !== active; });
    variantSelect.value = active;
    const entering = currentVariants.find(variant => variant.dataset.variant === active);
    const enteringFrame = entering.querySelector('.sh-stage');
    if (enteringFrame) enteringFrame.scrollTop = frameOffset;
    scrollTo(scrollX, pageOffset);
  }
  variantSelect.onchange = () => applyVariant(variantSelect.value);

  const declared = (stage.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
  const currentStates = [...new Set(['Default', ...declared])];
  function buildStates() {
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    stage.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => {
    applyState(stateSelect.value);
    switchingId = stateSelect.value === 'Switching' ? 'sam' : null;
    renderAll();
  };

  window.comparisonShell = {
    setState: applyState,
    getQuestion: () => question,
    getState: () => stateSelect.value,
    setVariant: applyVariant,
    getVariant: () => variantSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  // Start in the viewer's own theme; the switch still toggles both ways.
  let dark = matchMedia('(prefers-color-scheme: dark)').matches || document.documentElement.dataset.theme === 'dark';
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  renderAll();
  buildStates();
  buildVariants();
</script>
